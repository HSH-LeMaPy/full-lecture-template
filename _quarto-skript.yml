format:
  html:
    lang: de
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 4
    code-fold: show
    code-tools:
      source: false
      toggle: true
      caption: Code
    html-math-method: mathml
    embed-resources: false
    self-contained-math: false
    # ─── Lösungs-Freigabe nach Datum ───
    include-after-body:
      - solutions_release/solutions-release.html

author: ""
